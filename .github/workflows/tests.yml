name: Test Formulas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-formulas:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Homebrew
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@master
      
    - name: Test formula syntax
      run: |
        brew audit --strict Formula/*.rb
        
